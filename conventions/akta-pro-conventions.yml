description: 'Cross-cutting semantics of the akta.pro REST API (14 operations, all under /api/v1/). The surface
  is read-mostly: 11 GET reads plus three POSTs, of which two (generateCompanyList, translateQuery) are compute
  requests with no stored side effect and one (createCompanyAdditionRequest) creates an asynchronous addition request.'
base_url: https://api.akta.pro/api
api_style: REST over HTTPS, JSON responses (company_data Markdown variant via MCP/CLI)
authentication:
  scheme: apiKey in header x-api-key
  key_prefix: wk_
  docs: https://docs.akta.pro/getting-started/overview
  detail: See authentication/akta-pro-authentication.yml
idempotency:
  coverage: none
  supported: false
  mechanism: null
  applies_to: []
  docs: null
  detail: 'No Idempotency-Key header or replay-protection mechanism is documented or declared in the contract. The
    one stateful write, POST /v1/company/addition-requests, is naturally de-duplicated at the resource level: "If
    the company already exists in the database, the API tells you so immediately and returns its details so no addition
    request is created" - but that is not a client-controlled idempotency key.'
dry_run_mode:
  coverage: na
  detail: The two compute POSTs (list generation, filter builder) have no side effects; the Filter Builder is itself
    the rehearsal step the docs recommend before List Generation ("gives you a reviewable, reusable filter set you
    can inspect, tweak, or cache before running"). No dry-run flag exists for the addition request.
reversibility:
  coverage: none
  grade: none
  write_surfaces:
  - operation: createCompanyAdditionRequest
    reversal: null
    window: null
    docs: https://docs.akta.pro/docs/supporting-apis/company-addition
    note: No cancel or withdraw operation for an addition request is published; the request runs pending -> in_progress
      -> completed|failed and can only be observed via getRequestStatus or a webhook.
  - operation: generateCompanyList
    reversal: na
    note: Compute only; nothing to reverse. Credits consumed are not documented as refundable.
  - operation: translateQuery
    reversal: na
    note: Compute only; nothing to reverse.
pagination:
