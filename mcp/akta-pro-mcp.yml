tools_source:
  l3: table
  evidence_url: https://docs.akta.pro/docs/developer-tools/mcp/tools.md
  note: Tool names and descriptions are as PUBLISHED by the provider in its MCP Tools reference table; they were
    not returned by a live tools/list (gated, 401). All tools are documented as synchronous; only company_data returns
    Markdown, every other tool JSON. Alternative-signal tools return 403 on plans that do not cover them.
tools:
- name: company_search
  description: Resolve a company name or website to Akta identifiers (uuid, website, status)
  group: free
- name: industry_search
  description: Resolve a free-text industry or topic to ranked industry codes, used to filter news by industry
  group: free
- name: account_status
  description: Your plan tier (is_enterprise, package_type) and remaining credit balance
  group: free
- name: list_filters
  description: List the available filter fields for generate_company_list, grouped by filter category
  group: free
- name: get_filter_values
  description: Get the allowed values for one or more filters, used to build a valid filters payload before calling
    generate_company_list
  group: free
- name: company_data
  description: Rich, structured company profile as Markdown. Sections are selected explicitly and billed individually
  group: company data
- name: company_data_concise
  description: A single condensed company overview in JSON. No section selection, cheapest way to get a fast read
  group: company data
- name: news_signals
  description: List news filtered by company, industry, query, or title, with sentiment and AI summaries. No full
    article text
  group: news
- name: news_detail
  description: Full article body for specific article IDs returned by news_signals (max 10 per call)
  group: news
- name: news_types
  description: The news-type taxonomy. Contains 77 tag codes across 11 categories, used to filter news_signals by
    kind of news
  group: news
- name: generate_company_list
  description: Build a targeted list of companies using structured filters or a natural language query, with optional
    per-company data enrichment
  group: list generation
- name: headcount_trends
  description: Employee-count trend over time
  group: alternative signals (Subscription/Enterprise)
- name: website_traffic
  description: Web-traffic estimates
  group: alternative signals (Subscription/Enterprise)
- name: employee_reviews
  description: Glassdoor-style employee sentiment
  group: alternative signals (Subscription/Enterprise)
- name: product_reviews
  description: Returns product-level review. Call without a product ID first to list the catalog
  group: alternative signals (Subscription/Enterprise)
- name: job_posts
  description: Open roles and hiring signal
  group: alternative signals (Subscription/Enterprise)
- name: social_posts
  description: Company social posts
  group: alternative signals (Subscription/Enterprise)
credits:
  source: https://docs.akta.pro/docs/developer-tools/mcp/credits.md
  free_tools:
  - company_search
  - industry_search
  - account_status
  - news_types
  - list_filters
  - get_filter_values
  company_data_concise: 3 credits
  news_signals: 0.1 per call, 0.01 per record
  news_detail: 0.03 per record
