plans:
- name: Pay as you go
  price_text: $0.05
  price: 0.05
  billing: per credit, top-up
  description: Pay as you go is a top-up, credit-based plan with a single set of limits.
  features:
  - News Signals
  - Company Data (excluding Funding Detail and M&A and Investment)
  - Company Search / Industry Search
  - List Generation
  limits:
  - Global rate limit 25 / minute
  - Top-up credits are valid for 12 months from the date of purchase
  - Alternative data endpoints and Company Addition are not included on Pay as you go
- name: Subscription
  price_text: $0.04
  price: 0.04
  billing: per credit, monthly plan
  description: 'Subscription plans are tiered by monthly usage volume: 50, 100, 200, 500, and 1000.'
  features:
  - All Pay as you go APIs
  - Alternative Signals (Headcount Trends, Web Traffic, Job Posting, Social Posts, Employee Reviews, Product Reviews)
  - Company Addition API
  - Funding Detail and M&A and Investment sections (limited access)
  limits:
  - Global rate limit 100 / min to 300 / min by tier
  - Monthly plan credits expire at the end of each billing cycle and do not roll over
- name: Enterprise
  price_text: Custom
  description: Custom cost per credit; custom rate limits based on committed usage, endpoint requirements, and deployment
    needs.
  features:
  - Complete access to Funding Detail and M&A and Investment
  - Custom throughput, custom endpoints, de-duplicated feeds, committed-volume pricing
  limits:
  - Custom rate limits
