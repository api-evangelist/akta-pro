apis:
- name: akta.pro MCP Server
  description: >-
    Remote Streamable-HTTP MCP server (https://mcp.akta.pro/mcp) that exposes the akta.pro company-intelligence
    stack to Claude, ChatGPT, Cursor, VS Code, Claude Code and other MCP clients: company and industry
    search, structured company profiles, news signals and detail, list generation, and Subscription/Enterprise
    alternative-signal tools. Authenticates by OAuth (RFC 9728 protected-resource metadata, dynamic client
    registration) or an x-api-key header; listed in the official MCP registry as io.github.akta-pro/akta.pro-MCP.
  humanURL: https://docs.akta.pro/docs/developer-tools/mcp/setup
